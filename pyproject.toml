[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat"
version = "0.1.0"
description = "Enterprise Cryptographic Discovery and Analysis Tool (Person 3 platform layer)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
    # Real-scan path (P2 discovery + P1 analysis). Imported lazily so the
    # mock/demo path stays stdlib-only (+jsonschema).
    "pydantic>=2.7",
    "pyyaml>=6",
    "cryptography>=42",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests", "ecdat/tests"]
pythonpath = ["."]
