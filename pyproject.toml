[project]
name = "ecdat"
version = "0.1.0"
description = "ECDAT - Cryptographic Discovery, Inventory, Analysis, and Migration-Readiness Platform (Person 2: Discovery Engine)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ECDAT Team"}]
keywords = ["cryptography", "discovery", "inventory", "scanner", "cir", "pqc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tomli>=2.0",
    "jsonschema>=4.21",
    "semgrep>=1.0.0; sys_platform != 'win32'",
    "lief>=0.14; sys_platform != 'win32'",
    "yara-x>=1.0; sys_platform != 'win32'",
    "cryptography>=42.0",
    "boto3>=1.34",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[project.scripts]
ecdat-discover = "ecdat.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "UP", "W", "C90", "PTH", "T20", "SIM", "RET"]
ignore = ["S101", "PTH123", "T201"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.setuptools]
# Ship MANIFEST.in runtime data (registry JSONs, web demos) inside the
# wheel; without this `pip install .` drops every non-.py file and an
# installed deployment crashes where a repo checkout works.
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ecdat*"]
exclude = ["referenceDocs*", ".venv-p1*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "ecdat/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
