[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat"
version = "0.1.0"
description = "Enterprise Cryptographic Discovery and Analysis Tool (Person 3 platform layer)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
