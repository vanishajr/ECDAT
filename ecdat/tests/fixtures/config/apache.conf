<VirtualHost *:443>
    ServerName secure.example.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/secure.example.com.crt
    SSLCertificateKeyFile /etc/ssl/private/secure.example.com.key
    SSLCACertificateFile /etc/ssl/certs/ca-bundle.crt

    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder on
</VirtualHost>

<VirtualHost *:443>
    ServerName legacy.example.com

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/legacy.example.com.crt
    SSLCertificateKeyFile /etc/ssl/private/legacy.example.com.key

    SSLProtocol all
    SSLCipherSuite ALL:!ADH:!EXPORT:!SSLv2:RC4+RSA:+HIGH:+MEDIUM:+LOW
</VirtualHost>